    opening_statement: '👋 Привет! Разбираешься с Dify? Давай сэкономим тебе время!

      Необязательно часами читать документацию, разбираться в десятках инструментов
      и выяснять, чем Dify отличается от других AI-платформ. Просто спроси меня!


      🚀 Помогу быстро разобраться:

      - Что умеет Dify, а чего от него ждать не стоит.

      - Когда стоит выбрать Dify, а когда лучше подойдёт n8n или десктоп-агенты.

      - Что доступно бесплатно, какие есть ограничения и на что придётся потратиться.

      - Чем отличаются основные инструменты платформы — Workflow, Chatflow и AI-агенты.

      - Какие инструменты подойдут для твоей идеи и с чего разумнее начать.


      Есть конкретная задача? Расскажи, что хочешь создать. Вместе разберёмся, подходит
      ли для этого Dify и какой путь выбрать.

      Спрашивай своими словами — я переведу сложную документацию на человеческий язык.
      😉'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - Что вообще можно сделать с помощью Dify?
    - Что вкладывают в понятие Агент на платформе Dify?
    - Можно ли создать автономного AI-агента?
    - Чем отличаются Workflow, Chatflow и AI-агент?
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
